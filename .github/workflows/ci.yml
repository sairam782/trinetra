name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - run: npm audit --omit=dev
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t trinetra:test .
      - name: Verify non-root container and readiness
        run: |
          test "$(docker inspect --format='{{.Config.User}}' trinetra:test)" = node
          docker run -d --name trinetra -e TRINETRA_AUTH_TOKEN=ci-only-token-with-at-least-32-characters -e PUBLIC_BASE_URL=https://trinetra.example trinetra:test
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format='{{.State.Health.Status}}' trinetra)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs trinetra
          exit 1
      - if: always()
        run: docker rm -f trinetra || true
