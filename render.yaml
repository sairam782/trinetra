# Single-instance deployment with persistent storage. Paid resources are provisioned
# only when this blueprint is explicitly deployed. Start in dry-run mode.
services:
  - type: web
    name: trinetra
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --ignore-scripts && npm run check
    startCommand: node backend/server.mjs
    healthCheckPath: /api/readiness
    disk:
      name: trinetra-data
      mountPath: /var/data/trinetra
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/trinetra
      - key: TRINETRA_AUTH_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: QWEN_LIVE_CALLS
        value: "false"
      - key: QWEN_API_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: REMEDIATION_EXECUTION_MODE
        value: dry-run
      - key: ENABLE_LOCAL_APPROVAL
        value: "false"
      - key: DEMO_CONTROLS_ENABLED
        value: "false"
      - key: MCP_CHAT_LIVE
        value: "false"
      - key: VERIFICATION_TIMEOUT_MS
        value: "180000"
